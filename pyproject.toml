[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peakpatch"
version = "1.0.0"
description = "PeakPatch: recovering negation from frozen CLIP intermediate features"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "open-clip-torch>=2.24.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
# Optional experiment tracking for the training scripts.
logging = ["wandb"]

[tool.hatch.build.targets.wheel]
packages = ["src/peakpatch"]
